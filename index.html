<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哎</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #fff;
            overflow: hidden;
        }
        /* 加载层 */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #loadingOverlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #07c160;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loadText {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 8px;
        }
        .progressBar {
            width: 240px;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 16px;
        }
        .progressFill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #07c160, #0fd472);
            border-radius: 3px;
            transition: width 0.1s linear;
        }
        .progressPercent {
            margin-top: 8px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #07c160;
        }
        /* 视频容器 */
        #videoContainer {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        #videoContainer video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* 叫按钮 - 初始隐藏 */
        #callSection {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        #callSection.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #07c160 0%, #059e4a 100%);
            border: none;
            border-radius: 56px;
            cursor: pointer;
            box-shadow: 
                0 8px 30px rgba(7, 193, 96, 0.35),
                0 0 0 1px rgba(7, 193, 96, 0.15),
                inset 0 1px 0 rgba(255,255,255,0.15);
            transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
            user-select: none;
            position: relative;
            overflow: hidden;
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.4s;
        }
        .btn:hover::before { left: 100%; }
        .btn:active { transform: scale(0.97); box-shadow: 0 4px 15px rgba(7, 193, 96, 0.35); }
        .btn .icon { font-size: 1.4rem; }
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 14px 32px;
            background: rgba(15, 15, 15, 0.95);
            color: #07c160;
            border: 1px solid rgba(7, 193, 96, 0.3);
            border-radius: 12px;
            font-size: 0.95rem;
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
            z-index: 999;
            backdrop-filter: blur(10px);
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>
    <!-- 加载层 -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loadText">视频加载中...</div>
        <div class="progressBar">
            <div class="progressFill" id="progressFill"></div>
        </div>
        <div class="progressPercent" id="progressPercent">0%</div>
    </div>

    <!-- 视频 -->
    <div id="videoContainer">
        <video 
            id="mainVideo"
            src="video.mp4"
            autoplay
            loop
            muted
            playsinline
            preload="auto">
        </video>
    </div>

    <!-- 叫按钮（初始隐藏） -->
    <div id="callSection">
        <button class="btn" id="callBtn" onclick="callWeChat()">
            <span class="icon">📞</span>
            <span>叫</span>
        </button>
    </div>

    <div class="toast" id="toast">已复制「父亲」到剪贴板</div>

    <script>
        const loadingOverlay = document.getElementById('loadingOverlay');
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const callSection = document.getElementById('callSection');
        const video = document.getElementById('mainVideo');
        const toast = document.getElementById('toast');

        let callShown = false;

        // 监听视频加载进度
        video.addEventListener('progress', () => {
            if (video.buffered.length > 0 && !callShown) {
                const bufferedEnd = video.buffered.end(video.buffered.length - 1);
                const duration = video.duration || 1;
                const percent = Math.min(100, Math.round((bufferedEnd / duration) * 100));
                
                progressFill.style.width = percent + '%';
                progressPercent.textContent = percent + '%';

                // 20% 显示叫按钮
                if (percent >= 20 && !callSection.classList.contains('visible')) {
                    callSection.classList.add('visible');
                }
            }
        });

        // 视频可播放时隐藏加载层
        video.addEventListener('canplay', () => {
            loadingOverlay.classList.add('hidden');
        });

        // 兜底：loadedmetadata 也尝试
        video.addEventListener('loadedmetadata', () => {
            if (video.buffered.length > 0) {
                const percent = Math.min(100, Math.round((video.buffered.end(0) / video.duration) * 100));
                progressFill.style.width = percent + '%';
                progressPercent.textContent = percent + '%';
                if (percent >= 20) callSection.classList.add('visible');
            }
        });

        // 叫按钮逻辑
        async function callWeChat() {
            const btn = document.getElementById('callBtn');
            
            // 1. 复制"父亲"到剪贴板
            try {
                await navigator.clipboard.writeText('父亲');
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = '父亲';
                ta.style.position = 'fixed'; ta.style.opacity = 0;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }
            
            // 显示提示
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2800);
            
            // 2. 尝试唤起微信
            const schemes = ['wechat://', 'weixin://', 'wechat://dl/chat'];
            let launched = false;
            for (const scheme of schemes) {
                try {
                    window.location.href = scheme;
                    launched = true;
                    break;
                } catch (e) {}
            }
            
            if (!launched) {
                btn.disabled = true;
                btn.innerHTML = '<span class="icon">⚠️</span><span>请手动打开微信</span>';
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = '<span class="icon">📞</span><span>叫</span>';
                }, 3000);
            }
        }
    </script>
</body>
</html>
