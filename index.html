<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilibili 视频 + 叫微信</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #fff;
        }
        .video-container {
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
        }
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .call-section {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #07c160 0%, #059e4a 100%);
            border: none;
            border-radius: 56px;
            cursor: pointer;
            box-shadow: 
                0 8px 30px rgba(7, 193, 96, 0.35),
                0 0 0 1px rgba(7, 193, 96, 0.15),
                inset 0 1px 0 rgba(255,255,255,0.15);
            transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
            user-select: none;
            position: relative;
            overflow: hidden;
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.4s;
        }
        .btn:hover::before { left: 100%; }
        .btn:active { transform: scale(0.97); box-shadow: 0 4px 15px rgba(7, 193, 96, 0.35); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn .icon { font-size: 1.4rem; }
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 14px 32px;
            background: rgba(15, 15, 15, 0.95);
            color: #07c160;
            border: 1px solid rgba(7, 193, 96, 0.3);
            border-radius: 12px;
            font-size: 0.95rem;
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
            z-index: 999;
            backdrop-filter: blur(10px);
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>
    <div class="video-container">
        <iframe 
            src="https://player.bilibili.com/player.html?bvid=BV1dujh6sERm&autoplay=1&high_quality=1&danmaku=0&loop=1" 
            scrolling="no" 
            allowfullscreen="true"
            allow="autoplay; encrypted-media; picture-in-picture"
            title="Bilibili 视频播放器">
        </iframe>
    </div>

    <div class="call-section">
        <button class="btn" id="callBtn" onclick="callWeChat()">
            <span class="icon">📞</span>
            <span>叫</span>
        </button>
    </div>

    <div class="toast" id="toast">已复制「父亲」到剪贴板</div>

    <script>
        async function callWeChat() {
            const btn = document.getElementById('callBtn');
            const toast = document.getElementById('toast');
            
            // 1. 复制"父亲"到剪贴板
            try {
                await navigator.clipboard.writeText('父亲');
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = '父亲';
                ta.style.position = 'fixed'; ta.style.opacity = 0;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }
            
            // 显示提示
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2800);
            
            // 2. 尝试唤起微信（多种方式兼容）
            const schemes = [
                'wechat://',           // 通用
                'weixin://',           // 备选
                'wechat://dl/chat'     // 直达聊天列表
            ];
            
            let launched = false;
            for (const scheme of schemes) {
                try {
                    window.location.href = scheme;
                    launched = true;
                    break;
                } catch (e) {}
            }
            
            // 如果 scheme 失败，给个友好提示
            if (!launched) {
                btn.disabled = true;
                btn.innerHTML = '<span class="icon">⚠️</span><span>请手动打开微信</span>';
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = '<span class="icon">📞</span><span>叫</span>';
                }, 3000);
            }
        }
    </script>
</body>
</html>
