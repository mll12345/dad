<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilibili 视频 + 叫微信</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #fff;
        }
        .video-container {
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 16 / 9;
        }
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        .call-section {
            padding: 24px 16px;
            text-align: center;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 40px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #07c160 0%, #06b358 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(7, 193, 96, 0.4);
            transition: transform 0.15s, box-shadow 0.15s;
            user-select: none;
        }
        .btn:active { transform: scale(0.96); box-shadow: 0 4px 15px rgba(7, 193, 96, 0.4); }
        .btn .icon { font-size: 1.5rem; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 12px 28px;
            background: rgba(0,0,0,0.85);
            color: #07c160;
            border-radius: 8px;
            font-size: 0.95rem;
            opacity: 0;
            transition: transform 0.3s, opacity 0.3s;
            z-index: 999;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        @media (max-width: 768px) {
            .video-container { border-radius: 0; }
            .video-container iframe { border-radius: 0; }
            .btn { padding: 14px 32px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <iframe 
            src="https://player.bilibili.com/player.html?bvid=BV1dujh6sERm&autoplay=1&high_quality=1&danmaku=0" 
            scrolling="no" 
            allowfullscreen="true"
            allow="autoplay; encrypted-media; picture-in-picture"
            title="Bilibili 视频播放器">
        </iframe>
    </div>

    <div class="call-section">
        <button class="btn" id="callBtn" onclick="callWeChat()">
            <span class="icon">📞</span>
            <span>叫</span>
        </button>
    </div>

    <div class="toast" id="toast">已复制「父亲」到剪贴板</div>

    <script>
        async function callWeChat() {
            const toast = document.getElementById('toast');
            
            // 1. 复制"父亲"到剪贴板
            try {
                await navigator.clipboard.writeText('父亲');
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = '父亲';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }
            
            // 显示提示
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
            
            // 2. 尝试唤起微信
            window.location.href = 'wechat://';
        }
    </script>
</body>
</html>
