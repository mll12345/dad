<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilibili 视频播放</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .video-container {
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 16 / 9;
        }
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        @media (max-width: 768px) {
            .video-container {
                width: 100%;
                border-radius: 0;
            }
            .video-container iframe {
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <!-- Bilibili 视频嵌入播放器，autoplay=1 实现自动播放 -->
        <iframe 
            src="https://player.bilibili.com/player.html?bvid=BV1dujh6sERm&autoplay=1&high_quality=1&danmaku=0" 
            scrolling="no" 
            allowfullscreen="true"
            allow="autoplay; encrypted-media; picture-in-picture"
            title="Bilibili 视频播放器">
        </iframe>
    </div>
    <script>
        // 尝试在页面加载时聚焦 iframe 以辅助自动播放
        window.addEventListener('load', function() {
            const iframe = document.querySelector('iframe');
            if (iframe) {
                iframe.focus();
            }
        });
    </script>
</body>
</html>
